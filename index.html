<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Husnul Khotimah — Portfolio | Machine learning & small experiments</title>
    <!-- Google Fonts: Chakra Petch, IBM Plex Mono, Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #win98-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(180deg, #6ab6ea 0%, #a5d8f7 46%, #dcf0fc 82%, #cbe5f6 100%);
        color: #111827;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        user-select: none;
        cursor: wait;
        transition: opacity 0.35s ease;
      }
      #win98-boot-screen.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      .win98-boot-clouds {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 320px 90px at 18% 24%, rgba(255, 255, 255, 0.72), transparent 70%),
          radial-gradient(ellipse 420px 110px at 78% 20%, rgba(255, 255, 255, 0.65), transparent 72%),
          radial-gradient(ellipse 360px 100px at 62% 72%, rgba(255, 255, 255, 0.58), transparent 70%),
          radial-gradient(ellipse 280px 85px at 14% 78%, rgba(255, 255, 255, 0.6), transparent 70%);
      }
      .win98-boot-center {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .win98-boot-brand {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 6px;
        line-height: 1;
      }
      .win98-boot-title {
        font-size: clamp(2.1rem, 5.5vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0b192c;
        text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
      }
      .win98-boot-98 {
        font-size: clamp(2.2rem, 5.8vw, 3.8rem);
        font-weight: 800;
        font-style: italic;
        color: #000080;
        text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.85);
      }
      .win98-boot-sub {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
        color: #1f3b5c;
        letter-spacing: 0.02em;
      }
      .win98-boot-skip {
        margin-top: 18px;
        font-size: 11px;
        color: #2f557f;
        opacity: 0.85;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.55);
        border-top: 1px solid #ffffff;
        border-left: 1px solid #ffffff;
        border-right: 1px solid #555555;
        border-bottom: 1px solid #555555;
        padding: 3px 10px;
      }
      .win98-boot-progress-track {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 18px;
        background: #9fc7e8;
        border-top: 2px solid #ffffff;
        overflow: hidden;
      }
      .win98-boot-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 38%;
        background: linear-gradient(90deg, #9fc7e8 0%, #1084d0 28%, #000080 52%, #1084d0 78%, #9fc7e8 100%);
        animation: win98BootSlide 1.35s linear infinite;
      }
      @keyframes win98BootSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .win98-boot-progress-bar {
          width: 100%;
          animation: none;
          background: linear-gradient(90deg, #1084d0 0%, #000080 50%, #1084d0 100%);
        }
      }
    </style>
  </head>
  <body class="bg-[#008080] text-[#111827] selection:bg-[#000080] selection:text-white font-sans antialiased">
    <!-- Iconic Windows 98 Boot Intro (renders immediately at 0ms before JS hydrates) -->
    <div id="win98-boot-screen" role="status" aria-live="polite" aria-label="Starting Portfolio 98">
      <div class="win98-boot-clouds" aria-hidden="true"></div>
      <div class="win98-boot-center">
        <!-- Classic 4-color waving window flag with trailing pixel blocks -->
        <svg width="112" height="86" viewBox="0 0 112 86" fill="none" aria-hidden="true" style="margin-bottom: 16px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.18));">
          <!-- Trailing black pixel blocks -->
          <rect x="6" y="18" width="6" height="6" fill="#111827"/>
          <rect x="15" y="14" width="7" height="7" fill="#111827"/>
          <rect x="12" y="29" width="7" height="7" fill="#111827"/>
          <rect x="4" y="42" width="6" height="6" fill="#111827"/>
          <rect x="14" y="47" width="8" height="8" fill="#111827"/>
          <rect x="8" y="61" width="6" height="6" fill="#111827"/>
          <!-- Black frame silhouette -->
          <path d="M27 17 C43 10, 56 19, 68 15 L63 41 C51 45, 38 36, 22 43 Z" fill="#111827"/>
          <path d="M72 14 C85 10, 96 16, 105 12 L100 38 C91 42, 80 36, 67 40 Z" fill="#111827"/>
          <path d="M21 47 C37 40, 50 49, 62 45 L57 72 C45 76, 32 67, 16 74 Z" fill="#111827"/>
          <path d="M66 44 C79 40, 90 46, 99 42 L94 69 C85 73, 74 67, 61 71 Z" fill="#111827"/>
          <!-- Inner 4 colors -->
          <path d="M30 20 C43 14, 54 22, 64 19 L60 38 C50 41, 39 33, 26 39 Z" fill="#EF4444"/>
          <path d="M75 17 C86 14, 94 19, 101 16 L97 35 C90 38, 82 33, 71 36 Z" fill="#22C55E"/>
          <path d="M24 50 C37 44, 48 52, 58 49 L54 69 C44 72, 33 64, 20 70 Z" fill="#3B82F6"/>
          <path d="M69 47 C80 44, 88 49, 95 46 L91 66 C84 69, 76 64, 65 67 Z" fill="#FACC15"/>
        </svg>

        <div style="font-size: 13px; font-weight: 700; color: #1f3b5c; margin-bottom: 4px; letter-spacing: 0.04em;">
          Husnul Khotimah
        </div>
        <div class="win98-boot-brand">
          <span class="win98-boot-title">Portfolio</span>
          <span class="win98-boot-98">98</span>
        </div>
        <div class="win98-boot-sub">Starting desktop environment...</div>
        <button id="win98-boot-skip" type="button" class="win98-boot-skip">
          Click or press Esc to skip
        </button>
      </div>
      <div class="win98-boot-progress-track" aria-hidden="true">
        <div class="win98-boot-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
